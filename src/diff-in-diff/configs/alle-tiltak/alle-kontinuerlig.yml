# ── Analysis parameters ────────────────────────────────────────────────────────
analysis:
  title: "Alle, kontinuerlig"
  treatment_start: "202506"   # First month of treatment (YYYYMM)
  data_start:      "202306"   # First month of the full panel
  data_end:        "202509"   # Last month of the full panel
  treatment_type:  "continuous"  # "continuous" or "discrete"
  variation:       regioner

  analysis_level:  "enhet"        # "region" (default) or "enhet"

  # Denominator definitions compared in the exploratory treatment analysis.
  # Each entry produces a separate treatment variable series.
  #   last_pre – denominator is tiltak in the last month before treatment (t = -1)
  denominator_definitions:
    - id: last_pre
      label: "Siste pre-måned (t-1)"

# ── Data sources ───────────────────────────────────────────────────────────────
data:
  tiltak_file: data/raw/tiltak/alle-tiltak.csv
  tiltak_label: "Alle tiltak"

  enhet_mapping_file: data/pre/enhetsmapping.json

  indikatorer:
    - name:        atid3
      file:        data/raw/indikatorer/enhet/nedbrytning/alle/atid3.csv
      description: "Arbeidstid neste tre måneder"

    - name:        jobb3
      file:        data/raw/indikatorer/enhet/nedbrytning/alle/jobb3.csv
      description: "I jobb etter 3 måneder"
