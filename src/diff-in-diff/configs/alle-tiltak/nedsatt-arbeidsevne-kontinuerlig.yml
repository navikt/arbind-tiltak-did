      file:        data/raw/indikatorer/enhet/nedbrytning/innsatsgruppe_-_trenger_veiledning_nedsatt_arbeidsevne/atid3.csv
      description: "Arbeidstid neste tre måneder"

    - name:        jobb3
      file:        data/raw/indikatorer/enhet/nedbrytning/innsatsgruppe_-_trenger_veiledning_nedsatt_arbeidsevne/jobb3.csv
